<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro de Atendimento — Clínica Ser Educa</title>

<!-- Biblioteca para gerar o PDF com texto, sem captura da tela -->
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  defer>
</script>

<style>
  :root {
    --cream: #faf7f2;
    --paper: #ffffff;
    --sage: #4a6b55;
    --brown: #6b4f3a;
    --ink: #242424;
    --muted: #625e58;
    --border: #ddd5c8;
    --soft: #f4f0e8;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
  }

  [hidden] {
    display: none !important;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button {
    min-height: 46px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 20px;
    cursor: pointer;
    font-weight: 600;
    touch-action: manipulation;
  }

  button:disabled {
    opacity: .6;
    cursor: wait;
  }

  button:focus-visible,
  input:focus,
  select:focus,
  textarea:focus {
    outline: 3px solid #bad2c1;
    outline-offset: 2px;
  }

  .primary {
    background: var(--sage);
    border-color: var(--sage);
    color: white;
  }

  .secondary {
    background: var(--soft);
    color: var(--sage);
  }

  .screen-wrapper {
    max-width: 880px;
    margin: auto;
    padding: 32px 22px 60px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 22px;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--sage);
    color: white;
    font-size: 25px;
  }

  .header h1 {
    margin: 0 0 5px;
    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: normal;
    color: var(--sage);
  }

  .header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 30px;
    box-shadow: 0 3px 18px #00000008;
  }

  .card h2 {
    margin: 0 0 25px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    color: var(--brown);
    font: normal 18px Georgia, serif;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 0;
  }

  .full {
    grid-column: 1 / -1;
  }

  label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  input,
  select,
  textarea {
    width: 100%;
    min-width: 0;
    background: var(--cream);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 11px 12px;
    font-size: 16px;
  }

  textarea {
    min-height: 180px;
    resize: vertical;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .help {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .form-actions {
    margin-top: 26px;
    display: flex;
    justify-content: flex-end;
  }

  /* Segunda tela */

  #preview-screen {
    min-height: 100vh;
    background: #dfe3e6;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: white;
    border-bottom: 1px solid #ccc;
    padding: 12px 18px;
    box-shadow: 0 2px 9px #00000012;
  }

  .toolbar-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .toolbar-title {
    margin: 0;
    font-size: 16px;
    color: var(--sage);
  }

  .toolbar-info {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
  }

  .toolbar-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  #status-message {
    max-width: 1100px;
    margin: 8px auto 0;
    font-size: 13px;
    line-height: 1.4;
    color: var(--muted);
  }

  #pages {
    padding: 24px 12px 40px;
  }

  /*
    O contêiner reserva a altura da folha já reduzida.
    A folha mantém suas medidas A4 reais.
  */
  .page-shell {
    position: relative;
    margin: 0 auto 24px;
  }

  .a4-page {
    position: absolute;
    top: 0;
    left: 0;
    width: 210mm;
    height: 297mm;
    background: white;
    color: #111;
    transform-origin: top left;
    box-shadow: 0 4px 22px #00000025;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  .report-title {
    position: absolute;
    top: 18mm;
    left: 15mm;
    width: 180mm;
    margin: 0;
    text-align: center;
    font: normal 16pt Georgia, "Times New Roman", serif;
    line-height: 1.2;
  }

  .report-meta {
    position: absolute;
    top: 35mm;
    left: 15mm;
    width: 180mm;
    font-size: 10pt;
    line-height: 1.5;
  }

  .report-meta p {
    margin: 0 0 1mm;
    overflow-wrap: anywhere;
  }

  .report-rule {
    position: absolute;
    top: 62mm;
    left: 15mm;
    width: 180mm;
    border-top: .25mm solid #ccc;
  }

  .report-body {
    position: absolute;
    top: 67mm;
    left: 15mm;
    width: 180mm;
    font-size: 11pt;
    line-height: 6mm;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .report-line {
    height: 6mm;
    margin: 0;
    white-space: pre;
  }

  .report-footer {
    position: absolute;
    top: 250mm;
    left: 15mm;
    width: 180mm;
    padding-top: 4mm;
    border-top: .25mm solid #ccc;
    text-align: center;
    line-height: 1.5;
  }

  .professional {
    font: 12pt Georgia, serif;
    margin-bottom: 2mm;
  }

  .crp {
    font-size: 9pt;
    margin-bottom: 3mm;
  }

  .clinic {
    font: 11pt Georgia, serif;
    margin-bottom: 2mm;
  }

  .contact {
    font-size: 8pt;
    color: #444;
  }

  .addresses {
    font-size: 7pt;
    color: #555;
    line-height: 1.5;
  }

  .page-number {
    position: absolute;
    bottom: 8mm;
    left: 15mm;
    width: 180mm;
    text-align: right;
    font-size: 8pt;
    color: #666;
  }

  @media (max-width: 600px) {
    .screen-wrapper {
      padding: 22px 12px 40px;
    }

    .card {
      padding: 22px 16px;
    }

    .grid {
      grid-template-columns: 1fr;
    }

    .header h1 {
      font-size: 22px;
    }

    .form-actions button {
      width: 100%;
    }

    .toolbar {
      padding: 10px;
    }

    .toolbar-inner,
    .toolbar-actions {
      width: 100%;
    }

    .toolbar-actions button {
      flex: 1;
      padding: 10px;
      font-size: 13px;
    }

    #pages {
      padding: 16px 8px 30px;
    }
  }

  /*
    As margens de 15 mm já estão dentro de cada folha.
    Não somar outra margem externa na impressão.
  */
  @page {
    size: A4 portrait;
    margin: 0;
  }

  @media print {
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      background: white !important;
    }

    #form-screen,
    .toolbar {
      display: none !important;
    }

    #preview-screen {
      display: block !important;
      background: white !important;
      min-height: 0;
    }

    #pages {
      margin: 0 !important;
      padding: 0 !important;
    }

    .page-shell {
      width: 210mm !important;
      height: 297mm !important;
      margin: 0 !important;
      break-after: page;
      page-break-after: always;
      break-inside: avoid;
    }

    .page-shell:last-child {
      break-after: auto;
      page-break-after: auto;
    }

    .a4-page {
      position: relative !important;
      transform: none !important;
      box-shadow: none !important;
      margin: 0 !important;
    }
  }
</style>
</head>

<body>

<!-- PRIMEIRA TELA: FORMULÁRIO -->
<main id="form-screen" class="screen-wrapper">

  <header class="header">
    <div class="logo" aria-hidden="true">●</div>
    <div>
      <h1>Registro de Atendimento</h1>
      <p>Clínica Ser Educa · Piracicaba – SP</p>
    </div>
  </header>

  <section class="card">
    <h2>Dados do Atendimento</h2>

    <form id="attendance-form">
      <div class="grid">

        <div class="field full">
          <label for="sel-paciente">Paciente</label>
          <select id="sel-paciente" required>
            <option value="">— Selecione o paciente —</option>
          </select>
        </div>

        <div class="field">
          <label for="sel-mes">Mês</label>
          <select id="sel-mes" required>
            <option value="">— Selecione o mês —</option>
            <option>JANEIRO</option>
            <option>FEVEREIRO</option>
            <option>MARÇO</option>
            <option>ABRIL</option>
            <option>MAIO</option>
            <option>JUNHO</option>
            <option>JULHO</option>
            <option>AGOSTO</option>
            <option>SETEMBRO</option>
            <option>OUTUBRO</option>
            <option>NOVEMBRO</option>
            <option>DEZEMBRO</option>
          </select>
        </div>

        <div class="field">
          <label for="sel-ano">Ano</label>
          <select id="sel-ano" required></select>
        </div>

        <div class="field">
          <label for="data-ini">Data início do período</label>
          <input type="date" id="data-ini">
        </div>

        <div class="field">
          <label for="data-fim">Data fim do período</label>
          <input type="date" id="data-fim">
        </div>

        <div class="field">
          <label for="sel-qtd">Qtd. de atendimentos no mês</label>
          <select id="sel-qtd" required>
            <option value="">— Selecione —</option>
            <option value="1">1 Atendimento</option>
            <option value="2">2 Atendimentos</option>
            <option value="3">3 Atendimentos</option>
            <option value="4">4 Atendimentos</option>
            <option value="5">5 Atendimentos</option>
          </select>
        </div>

        <div class="field">
          <label for="sel-status">Status do paciente</label>
          <select id="sel-status" required>
            <option value="">— Selecione —</option>
            <option value="ativo">ATIVO – Em Atendimento</option>
            <option value="inativo">INATIVO – Recebeu Alta</option>
          </select>
        </div>

        <div class="field" id="grp-alta" hidden>
          <label for="data-alta">Data da alta</label>
          <input type="date" id="data-alta">
        </div>

        <div class="field full">
          <label for="txt-resumo">Resumo dos atendimentos</label>
          <textarea
            id="txt-resumo"
            placeholder="Descreva os atendimentos realizados no período..."
            required></textarea>

          <p class="help">
            O texto será distribuído dentro das margens da folha A4.
            Se necessário, serão criadas páginas adicionais.
          </p>
        </div>

        <div class="field full">
          <label for="sel-obs">Observação final</label>
          <select id="sel-obs">
            <option>
              Paciente permanece em acompanhamento psicológico.
            </option>
            <option>
              Paciente recebeu alta do acompanhamento psicológico.
            </option>
            <option>
              Paciente em processo de encerramento do acompanhamento.
            </option>
            <option value="">Sem observação final.</option>
          </select>
        </div>

      </div>

      <div class="form-actions">
        <button
          type="submit"
          id="btn-view"
          class="primary">
          Visualizar relatório
        </button>
      </div>
    </form>
  </section>
</main>

<!-- SEGUNDA TELA: VISUALIZAÇÃO A4 -->
<section id="preview-screen" hidden>

  <header class="toolbar">
    <div class="toolbar-inner">
      <div>
        <h2 class="toolbar-title">Visualização do relatório</h2>
        <div class="toolbar-info" id="page-info">
          Folha A4 · Margens internas de 15 mm
        </div>
      </div>

      <div class="toolbar-actions">
        <button
          type="button"
          class="secondary"
          id="btn-back">
          Voltar e editar
        </button>

        <button
          type="button"
          class="primary"
          id="btn-save">
          Salvar em PDF
        </button>

        <button
          type="button"
          class="secondary"
          id="btn-print">
          Imprimir
        </button>
      </div>
    </div>

    <p id="status-message" role="status" aria-live="polite"></p>
  </header>

  <div id="pages"></div>
</section>

<script>
"use strict";

const pacientes = [
  "ALICE SANTOS DE MELO",
  "AMANDA SILVA LOPES",
  "ANA BEATRIZ DE ARAUJO SOUZA",

  "FELIPE TAVARES GUIDOLIM",
  "GABRIEL BERTO FAVA",
  "GABRIELA GRIM",

  "GUILHERME FRANCISCO GONZAGA ALVES",

  "HELOISA DIAS ARAUJO",
  "JOAQUIM PAIAO MACHADO",
  "KATE DOS SANTOS OLIVEIRA",
  "LAURA DE PAIVA COELHO",
  "LEONARDO TOTOLI STOQUI",
  "LORENA MODOLO CRUZ",
  "LORENZO LUIZ TAVARES",
  "LUIZ GUSTAVO POSSIGNOLO CADORIN",

  "MANOELA ALMEIDA LEME",
  "MANUELA VITORIA DOS SANTOS FRANCISCO",
  "MARIA EDUARDA CANDIDO FERREIRA",
  "MARIA LAURA DA SILVA",
  "MAURO DE MELLO ROCHA NETO",
  "MAURO HENRIQUE SALGUEIRO RODRIGUES VIOLA",
  "MIGUEL DE LIMA SANJUAN",
  "NAYSLA GABRIELLI CERRADIL GOMES",
  "NICOLAS LIMA",
  "OLIVIA NASCIMENTO MAESTRO",
  "OTAVIO SOARES THOMAZELLA",
  "PAULO AUGUSTO SARTORI DE ARAUJO",
  "PEDRO MIGUEL MOREIRA PINHEIRO",
  "PEDRO SILVA CASTILHO VILAS BOAS",
  "PIETRO DALA ANTONIA DE MOURA",
  "RAFAELA ZAMBELLI DE SOUSA",
  "RAISSA TOLEDO REAL MARTELLI",
  "SARAH FIGUEIREDO",
  "SOFIA NAZATTO",
  "THOMAS MIGUEL DO SANTOS PRATES",
  "THOMAS TORETTA PALOMARES",
  "VALENTINA AMARAL MELLO CHIARANDA",
  "VALENTINA FRIGATTO OLIVEIRA LIMA",
  "VALENTINA MARUCAS DAMO VIETRI",
  "VITORIA BARBOSA DA SILVA",
  "VITORIA DE ARAUJO ZAMBELLO",
  "YURI LUCAS GOMES PINHEIRO"
];

const $ = id => document.getElementById(id);

let relatorioAtual = null;
let posicaoFormulario = 0;

const LINHAS_POR_PAGINA = 29;
const LARGURA_TEXTO = 180;

function iniciar() {
  pacientes
    .sort((a, b) => a.localeCompare(b, "pt-BR"))
    .forEach(nome => {
      $("sel-paciente").add(new Option(nome, nome));
    });

  const anoAtual = new Date().getFullYear();

  for (let ano = 2025; ano <= Math.max(2027, anoAtual + 2); ano++) {
    $("sel-ano").add(new Option(String(ano), String(ano)));
  }

  $("sel-ano").value = String(anoAtual);

  $("attendance-form").addEventListener("submit", abrirRelatorio);
  $("btn-back").addEventListener("click", voltar);
  $("btn-save").addEventListener("click", salvarPDF);
  $("btn-print").addEventListener("click", imprimir);

  $("sel-status").addEventListener("change", function () {
    const inativo = this.value === "inativo";

    $("grp-alta").hidden = !inativo;
    $("data-alta").required = inativo;

    if (!inativo) {
      $("data-alta").value = "";
    }

    $("sel-obs").selectedIndex = inativo ? 1 : 0;
  });

  window.addEventListener("resize", ajustarFolhas);
}

function formatarData(valor) {
  if (!valor) return "";
  const [ano, mes, dia] = valor.split("-");
  return `${dia}/${mes}/${ano}`;
}

function coletarDados() {
  const inicio = $("data-ini").value;
  const fim = $("data-fim").value;
  const inativo = $("sel-status").value === "inativo";
  const alta = $("data-alta").value;

  let status = inativo
    ? "INATIVO - Recebeu Alta"
    : "ATIVO - Em Atendimento";

  if (inativo && alta) {
    status += ` em ${formatarData(alta)}`;
  }

  const quantidade = Number($("sel-qtd").value);

  return {
    paciente: $("sel-paciente").value,
    mes: $("sel-mes").value,
    ano: $("sel-ano").value,
    inicio,
    fim,
    periodo: inicio && fim
      ? `${formatarData(inicio)} a ${formatarData(fim)}`
      : "Não informado",
    quantidade: quantidade === 1
      ? "1 Atendimento"
      : `${quantidade} Atendimentos`,
    status,
    resumo: $("txt-resumo").value
      .replace(/\r\n?/g, "\n")
      .replace(/\t/g, "    ")
      .trim(),
    observacao: $("sel-obs").value.trim()
  };
}

function validarPeriodo(dados) {
  if (Boolean(dados.inicio) !== Boolean(dados.fim)) {
    alert("Informe as duas datas do período ou deixe ambas em branco.");
    return false;
  }

  if (dados.inicio && dados.fim && dados.inicio > dados.fim) {
    alert("A data final não pode ser anterior à data inicial.");
    $("data-fim").focus();
    return false;
  }

  return true;
}

function criarPDFBase() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    throw new Error(
      "A biblioteca de PDF não foi carregada. " +
      "Verifique a conexão com a internet e recarregue a página."
    );
  }

  return new window.jspdf.jsPDF({
    orientation: "portrait",
    unit: "mm",
    format: "a4",
    compress: true
  });
}

/*
  A mesma divisão de linhas é usada na visualização e no PDF.
  Cada parágrafo é separado, preservando as quebras digitadas.
*/
function dividirResumo(pdf, dados) {
  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(11);

  const texto = dados.resumo +
    (dados.observacao ? "\n\n" + dados.observacao : "");

  const linhas = [];

  texto.split("\n").forEach(paragrafo => {
    if (paragrafo === "") {
      linhas.push("");
      return;
    }

    const partes = pdf.splitTextToSize(
      paragrafo,
      LARGURA_TEXTO - 1
    );

    linhas.push(...partes);
  });

  const paginas = [];

  for (let i = 0; i < linhas.length; i += LINHAS_POR_PAGINA) {
    paginas.push(linhas.slice(i, i + LINHAS_POR_PAGINA));
  }

  return paginas.length ? paginas : [[""]];
}

function criarElemento(tag, classe, texto) {
  const elemento = document.createElement(tag);

  if (classe) elemento.className = classe;
  if (texto !== undefined) elemento.textContent = texto;

  return elemento;
}

function adicionarMeta(container, titulo, valor) {
  const linha = criarElemento("p");
  const rotulo = criarElemento("strong", "", titulo + " ");

  linha.append(rotulo, document.createTextNode(valor));
  container.appendChild(linha);
}

function criarRodape() {
  const rodape = criarElemento("footer", "report-footer");

  rodape.append(
    criarElemento(
      "div",
      "professional",
      "Juliana de Matos Brasilio"
    ),
    criarElemento("div", "crp", "CRP: 06/122153"),
    criarElemento("div", "clinic", "Clínica Ser Educa"),
    criarElemento(
      "div",
      "contact",
      "(19) 3927-0776 · (19) 98440-5040"
    ),
    criarElemento(
      "div",
      "addresses",
      "Unidade 1: Rua Machado de Assis, 289 · " +
      "Unidade 2: Avenida Independência, 1432"
    ),
    criarElemento(
      "div",
      "addresses",
      "Unidade 3: Rua Machado de Assis, 264 · Piracicaba - SP"
    )
  );

  return rodape;
}

function renderizarRelatorio(dados, paginas) {
  $("pages").replaceChildren();

  paginas.forEach((linhas, indice) => {
    const shell = criarElemento("div", "page-shell");
    const folha = criarElemento("article", "a4-page");

    folha.setAttribute(
      "aria-label",
      `Página ${indice + 1} de ${paginas.length}`
    );

    folha.appendChild(
      criarElemento(
        "h1",
        "report-title",
        `REGISTRO DE ATENDIMENTO ${dados.ano}`
      )
    );

    const meta = criarElemento("div", "report-meta");

    adicionarMeta(meta, "Paciente:", dados.paciente);
    adicionarMeta(
      meta,
      "Mês:",
      `${dados.mes} | Período: ${dados.periodo}`
    );
    adicionarMeta(
      meta,
      "Atendimentos:",
      dados.quantidade
    );
    adicionarMeta(meta, "Status:", dados.status);

    const corpo = criarElemento("div", "report-body");

    linhas.forEach(linha => {
      corpo.appendChild(
        criarElemento("div", "report-line", linha || "\u00a0")
      );
    });

    folha.append(
      meta,
      criarElemento("div", "report-rule"),
      corpo,
      criarRodape(),
      criarElemento(
        "div",
        "page-number",
        `Página ${indice + 1} de ${paginas.length}`
      )
    );

    shell.appendChild(folha);
    $("pages").appendChild(shell);
  });

  $("page-info").textContent =
    `A4 · 210 × 297 mm · Margens de 15 mm · ` +
    `${paginas.length} ${paginas.length === 1 ? "página" : "páginas"}`;
}

function ajustarFolhas() {
  if ($("preview-screen").hidden) return;

  const larguraDisponivel = $("pages").clientWidth -
    (window.innerWidth <= 600 ? 16 : 24);

  document.querySelectorAll(".page-shell").forEach(shell => {
    const folha = shell.querySelector(".a4-page");

    const larguraOriginal = folha.offsetWidth;
    const alturaOriginal = folha.offsetHeight;

    const escala = Math.min(
      1,
      larguraDisponivel / larguraOriginal
    );

    folha.style.transform = `scale(${escala})`;
    shell.style.width = `${larguraOriginal * escala}px`;
    shell.style.height = `${alturaOriginal * escala}px`;
  });
}

function abrirRelatorio(event) {
  event.preventDefault();

  const dados = coletarDados();
  if (!validarPeriodo(dados)) return;

  try {
    const pdf = criarPDFBase();
    const paginas = dividirResumo(pdf, dados);

    relatorioAtual = { dados, paginas };

    renderizarRelatorio(dados, paginas);

    posicaoFormulario = window.scrollY;

    $("form-screen").hidden = true;
    $("preview-screen").hidden = false;
    $("status-message").textContent =
      "Confira o conteúdo antes de salvar ou imprimir.";

    window.scrollTo(0, 0);
    requestAnimationFrame(ajustarFolhas);

  } catch (erro) {
    alert(erro.message);
  }
}

function voltar() {
  $("preview-screen").hidden = true;
  $("form-screen").hidden = false;

  requestAnimationFrame(() => {
    window.scrollTo(0, posicaoFormulario);
  });
}

function desenharCabecalho(pdf, dados) {
  pdf.setTextColor(20, 20, 20);
  pdf.setFont("times", "normal");
  pdf.setFontSize(16);

  pdf.text(
    `REGISTRO DE ATENDIMENTO ${dados.ano}`,
    105,
    23,
    { align: "center" }
  );

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(10);

  const informacoes = [
    `Paciente: ${dados.paciente}`,
    `Mês: ${dados.mes} | Período: ${dados.periodo}`,
    `Atendimentos: ${dados.quantidade}`,
    `Status: ${dados.status}`
  ];

  informacoes.forEach((texto, indice) => {
    pdf.text(texto, 15, 39 + indice * 5);
  });

  pdf.setDrawColor(200, 200, 200);
  pdf.setLineWidth(0.25);
  pdf.line(15, 62, 195, 62);
}

function desenharRodape(pdf, pagina, total) {
  pdf.setDrawColor(200, 200, 200);
  pdf.setLineWidth(0.25);
  pdf.line(15, 250, 195, 250);

  pdf.setTextColor(20, 20, 20);
  pdf.setFont("times", "normal");
  pdf.setFontSize(12);
  pdf.text(
    "Juliana de Matos Brasilio",
    105,
    257,
    { align: "center" }
  );

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(9);
  pdf.text("CRP: 06/122153", 105, 262, { align: "center" });

  pdf.setFont("times", "normal");
  pdf.setFontSize(11);
  pdf.text("Clínica Ser Educa", 105, 269, { align: "center" });

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(8);
  pdf.setTextColor(65, 65, 65);

  pdf.text(
    "(19) 3927-0776 | (19) 98440-5040",
    105,
    274,
    { align: "center" }
  );

  pdf.setFontSize(7);

  pdf.text(
    "Unidade 1: Rua Machado de Assis, 289 | " +
    "Unidade 2: Avenida Independência, 1432",
    105,
    279,
    { align: "center" }
  );

  pdf.text(
    "Unidade 3: Rua Machado de Assis, 264 | Piracicaba - SP",
    105,
    283,
    { align: "center" }
  );

  pdf.setFontSize(8);
  pdf.setTextColor(100, 100, 100);
  pdf.text(
    `Página ${pagina} de ${total}`,

    { align: "right" }
  );
}

function gerarPDF() {
  if (!relatorioAtual) {
    throw new Error("Visualize o relatório antes de salvar.");
  }

  const { dados, paginas } = relatorioAtual;
  const pdf = criarPDFBase();

  pdf.setProperties({
    title: `Registro de Atendimento ${dados.ano}`,
    author: "Clínica Ser Educa",
    subject: "Registro de atendimento"
  });

  paginas.forEach((linhas, indice) => {
    if (indice > 0) pdf.addPage("a4", "portrait");

    desenharCabecalho(pdf, dados);

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(11);
    pdf.setTextColor(20, 20, 20);

    linhas.forEach((linha, numero) => {
      if (linha) {
        pdf.text(linha, 15, 71 + numero * 6);
      }
    });

    desenharRodape(pdf, indice + 1, paginas.length);
  });

  return pdf;
}

function nomeArquivo(dados) {
  const meses = {
    JANEIRO: "JAN", FEVEREIRO: "FEV", "MARÇO": "MAR",
    ABRIL: "ABR", MAIO: "MAI", JUNHO: "JUN",
    JULHO: "JUL", AGOSTO: "AGO", SETEMBRO: "SET",
    OUTUBRO: "OUT", NOVEMBRO: "NOV", DEZEMBRO: "DEZ"
  };

  const paciente = dados.paciente.trim().toUpperCase();
  return `${paciente} ${meses[dados.mes]}.${dados.ano}.pdf`;
}

async function salvarPDF() {
  const botao = $("btn-save");
  botao.disabled = true;
  botao.textContent = "Gerando PDF...";

  try {
    const pdf = gerarPDF();

    await pdf.save(
      nomeArquivo(relatorioAtual.dados),
      { returnPromise: true }
    );

    $("status-message").textContent =
      "PDF gerado. Confira os downloads ou a opção de salvar " +
      "apresentada pelo seu navegador.";

  } catch (erro) {
    $("status-message").textContent =
      "Não foi possível gerar o PDF: " + erro.message;

    alert(
      "Não foi possível salvar o PDF.\n\n" +
      erro.message
    );

  } finally {
    botao.disabled = false;
    botao.textContent = "Salvar em PDF";
  }
}

function imprimir() {
  if (!relatorioAtual) return;
  window.print();
}

iniciar();
